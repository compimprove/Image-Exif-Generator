name: Release desktop installers

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos-arm64:
    name: Build macOS ARM64 DMG
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate tag and runner
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "RELEASE_VERSION=0.0.0" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag such as v2.15.2, received: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "The macOS package must be built on ARM64." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          architecture: aarch64
          cache: gradle

      - name: Set up uv for bundled Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"

      - name: Bundle SynthID runtime
        run: python3 synthid/bundle.py

      - name: Test and package DMG
        shell: bash
        run: ./gradlew --no-daemon build :desktopApp:packageDmg

      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: image-exif-reset-macos-arm64-${{ env.RELEASE_VERSION }}
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-windows-x64:
    name: Build Windows x64 MSI
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate tag and runner
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            "RELEASE_VERSION=0.0.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }
          if ($env:GITHUB_REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Expected a tag such as v2.15.2, received: $env:GITHUB_REF_NAME"
          }
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64') {
            throw 'The Windows package must be built on x64.'
          }
          "RELEASE_VERSION=$($env:GITHUB_REF_NAME.Substring(1))" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64
          cache: gradle

      - name: Verify WiX Toolset
        shell: pwsh
        run: |
          Get-Command candle.exe -ErrorAction Stop
          Get-Command light.exe -ErrorAction Stop

      - name: Set up uv for bundled Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"

      - name: Bundle SynthID runtime
        shell: pwsh
        run: python synthid/bundle.py --cuda

      - name: Test and package MSI
        shell: pwsh
        run: .\gradlew.bat --no-daemon build :desktopApp:packageMsi

      - name: Print Windows packaging diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem desktopApp/build/compose/logs -Recurse -File -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Output "--- $($_.FullName)"; Get-Content $_.FullName }
          Get-ChildItem desktopApp/build/synthid -Recurse -File -ErrorAction SilentlyContinue |
            Sort-Object Length -Descending | Select-Object -First 15 FullName, Length | Format-List

      - name: Upload Windows packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-packaging-diagnostics
          path: |
            desktopApp/build/compose/logs/
            desktopApp/build/compose/tmp/*.args.txt
          if-no-files-found: ignore

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: image-exif-reset-windows-x64-${{ env.RELEASE_VERSION }}
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - build-macos-arm64
      - build-windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: image-exif-reset-*
          path: release-assets
          merge-multiple: true

      - name: Publish installers on the tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*.dmg release-assets/*.msi)
          if (( ${#assets[@]} != 2 )); then
            echo "Expected one DMG and one MSI, found ${#assets[@]} files." >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --title "Image EXIF Reset $GITHUB_REF_NAME" \
              --generate-notes
          fi
