name: Release desktop installers

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-macos-arm64:
    name: Build macOS ARM64 DMG
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate tag and runner
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "RELEASE_VERSION=1.0.0" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag such as v2.15.2, received: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "The macOS package must be built on ARM64." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          architecture: aarch64
          cache: gradle

      - name: Set up uv for bundled Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"

      - name: Bundle SynthID runtime
        run: python3 synthid/bundle.py

      - name: Test and package DMG
        shell: bash
        run: ./gradlew --no-daemon build :desktopApp:packageDmg

      - name: Print macOS packaging diagnostics
        if: failure()
        shell: bash
        run: find desktopApp/build/compose/logs -type f -exec cat {} +

      - name: Upload macOS packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-packaging-diagnostics
          path: |
            desktopApp/build/compose/logs/
            desktopApp/build/compose/tmp/*.args.txt
          if-no-files-found: ignore

      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: image-exif-reset-macos-arm64-${{ env.RELEASE_VERSION }}
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-windows-x64:
    name: Build Windows x64 MSI
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate tag and runner
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            "RELEASE_VERSION=1.0.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }
          if ($env:GITHUB_REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Expected a tag such as v2.15.2, received: $env:GITHUB_REF_NAME"
          }
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64') {
            throw 'The Windows package must be built on x64.'
          }
          "RELEASE_VERSION=$($env:GITHUB_REF_NAME.Substring(1))" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64
          cache: gradle

      - name: Verify WiX Toolset
        shell: pwsh
        run: |
          Get-Command candle.exe -ErrorAction Stop
          Get-Command light.exe -ErrorAction Stop

      - name: Set up uv for bundled Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"

      - name: Bundle SynthID runtime
        shell: pwsh
        run: python synthid/bundle.py --cuda

      - name: Test and package MSI
        shell: pwsh
        run: .\gradlew.bat --no-daemon build :desktopApp:packageMsi

      - name: Verify installed Windows runtime
        shell: pwsh
        run: |
          $msi = Get-ChildItem desktopApp/build/compose/binaries/main/msi/*.msi
          if (@($msi).Count -ne 1) { throw 'Expected exactly one MSI' }
          if (-not (Get-ChildItem desktopApp/build/compose/binaries/main/msi/*.cab)) { throw 'Missing Windows installer cabinets' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'installed image exif'
          $logs = New-Item -ItemType Directory -Force desktopApp/build/compose/logs/installer-smoke
          $installLog = Join-Path $logs.FullName 'install.log'
          try {
            $process = Start-Process msiexec.exe -ArgumentList @('/i', "`"$($msi.FullName)`"", '/qn', '/norestart', "INSTALLDIR=`"$installRoot`"", '/L*v', "`"$installLog`"") -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "MSI installation failed: $($process.ExitCode)" }
            $python = Join-Path $installRoot 'app/resources/synthid/python/python.exe'
            & $python -I -c "import torch, torchvision, diffusers, transformers, controlnet_aux, color_matcher; assert torch.version.cuda == '12.4'; assert torch.ones(1).sum().item() == 1; print('Installed CUDA runtime imports and CPU tensor operation OK')"
            if ($LASTEXITCODE -ne 0) { throw 'Installed runtime verification failed' }
          } finally {
            $uninstallLog = Join-Path $logs.FullName 'uninstall.log'
            $process = Start-Process msiexec.exe -ArgumentList @('/x', "`"$($msi.FullName)`"", '/qn', '/norestart', '/L*v', "`"$uninstallLog`"") -Wait -PassThru
            if ($process.ExitCode -notin @(0, 1605, 3010)) { throw "MSI uninstall failed: $($process.ExitCode)" }
          }

      - name: Print Windows packaging diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem desktopApp/build/compose/logs -Recurse -File -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Output "--- $($_.FullName)"; Get-Content $_.FullName }
          Get-ChildItem desktopApp/build/synthid -Recurse -File -ErrorAction SilentlyContinue |
            Sort-Object Length -Descending | Select-Object -First 15 FullName, Length | Format-List

      - name: Upload Windows packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-packaging-diagnostics
          path: |
            desktopApp/build/compose/logs/
            desktopApp/build/compose/tmp/*.args.txt
          if-no-files-found: ignore

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: image-exif-reset-windows-x64-${{ env.RELEASE_VERSION }}
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/msi/*.cab
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - build-macos-arm64
      - build-windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: image-exif-reset-*
          path: release-assets
          merge-multiple: true

      - name: Publish installers on the tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          dmgs=(release-assets/*.dmg)
          msis=(release-assets/*.msi)
          cabinets=(release-assets/*.cab)
          if (( ${#dmgs[@]} != 1 || ${#msis[@]} != 1 || ${#cabinets[@]} == 0 )); then
            echo "Expected one DMG, one MSI, and Windows cabinet files." >&2
            exit 1
          fi

          assets=("${dmgs[@]}" "${msis[@]}" "${cabinets[@]}")
          for asset in "${assets[@]}"; do
            if (( $(stat -c%s "$asset") >= 2147483648 )); then
              echo "Release asset exceeds GitHub's size limit: $asset" >&2
              exit 1
            fi
          done
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --title "Image EXIF Reset $GITHUB_REF_NAME" \
              --generate-notes
          fi
